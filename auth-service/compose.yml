services:
  oauth:
    build: .
    image: apce-stream-auth:local
    container_name: apce-stream-auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:3291:3291"
    volumes:
      - ./private/oauth.json:/run/secrets/oauth.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"
