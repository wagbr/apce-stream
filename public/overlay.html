</style></head><body><div id="root"></div><script>
const p=new URLSearchParams(location.search),mode=p.get('mode')||'wait',front=p.get('layer')==='front',root=document.getElementById('root');
if(!front){root.innerHTML='<div class="back"></div><div class="header"><div class="word">ATEU <span>CAST</span></div><div class="rule"></div><div class="caption">APCE</div><img class="apce" src="/assets/apce.png" alt="APCE"></div><div class="footer"><div class="topic" id="topic"></div><div class="channel">youtube.com/@apcedf</div></div>';const frames={solo:['solo'],duo:['host','guest'],room:['room'],media:['media','pip']};for(const f of frames[mode]||[]){const d=document.createElement('div');d.className='frame '+f;root.append(d);}if(mode==='wait'||mode==='end'){const c=document.createElement('div');c.className='center';c.innerHTML='<img src="/assets/ateucast.png" alt="Ateu Cast"><div class="line"></div><h1>'+(mode==='end'?'Obrigado pela companhia.':'Nossa conversa já vai começar.')+'</h1><p>ASSOCIAÇÃO DE ATEÍSTAS DO PLANALTO CENTRAL</p>';root.append(c);}}
else{const fields=mode==='solo'?[['host','solo-name']]:mode==='duo'?[['host','host-name'],['guest','guest-name']]:mode==='media'?[['host','pip-name']]:[];for(const [key,cls] of fields){const d=document.createElement('div');d.id=key;d.className='name '+cls;root.append(d);}}
async function update(){try{const l=await(await fetch('/api/labels')).json();for(const key of ['host','guest','topic']){const e=document.getElementById(key);if(e){e.textContent=l[key]||'';if(key!=='topic')e.style.display=l[key]?'block':'none';}}}catch(e){}}update();setInterval(update,1500);
