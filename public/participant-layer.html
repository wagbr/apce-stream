<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>APCE · Camada de participante</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:'Bahnschrift','Segoe UI',Arial,sans-serif}.frame{position:absolute;inset:0;border:1px solid #e6d3cb3d;background:linear-gradient(130deg,#1a1a22fa,#2d2d37ee);border-radius:13px;box-shadow:0 9px 30px #0005}.frame:before{content:'';position:absolute;inset:8px;border:1px solid #e6d3cb06;border-radius:7px}.frame:after{content:'';position:absolute;bottom:0;left:25px;width:90px;height:3px;background:#ef4d63;border-radius:3px}.tag{display:none;width:max-content;max-width:820px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:26px;font-weight:600;background:linear-gradient(90deg,#e6d3cbff,#f0ded8fa);color:#34303a;border-radius:3px 11px 11px 3px;border-left:6px solid #ef4d63;padding:12px 24px;box-shadow:0 4px 20px #0003}.compact .tag{max-width:320px;font-size:21px;padding:10px 16px}
</style></head><body><div id="layer"></div><script>
const p=new URLSearchParams(location.search),kind=p.get('kind'),role=p.get('person')==='guest'?'guest':'host',root=document.getElementById('layer');
if(kind==='frame'){root.className='frame';}else{root.className='tag';if(p.get('size')==='compact')document.body.className='compact';async function update(){try{const labels=await(await fetch('/api/labels')).json();root.textContent=labels[role]||'';root.style.display=labels[role]?'block':'none';}catch{}}update();setInterval(update,1500);}
</script></body></html>
