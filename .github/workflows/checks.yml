name: Verificações
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts -p 'test_preparar.py'
      - run: python scripts/check-public-files.py
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida pacotes, caminhos e integridade do instalador
        shell: powershell
        run: .\installer\test-functions.ps1
